name: Agent API Boundary Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API boundary tests
        env:
          AGENT_SERVER_TOKEN: test-secret
        run: python -m pytest -q tests/test_api_security.py tests/test_agent_api_boundary.py
