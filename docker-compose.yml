services:
  postgres:
    image: postgres:18
    container_name: workspace-ai-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workspace_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-workspace_ai_agent}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - workspace_ai_agent_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workspace} -d ${POSTGRES_DB:-workspace_ai_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: workspace-ai-agent-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - workspace_ai_agent_qdrant:/qdrant/storage

volumes:
  workspace_ai_agent_postgres:
  workspace_ai_agent_qdrant:
